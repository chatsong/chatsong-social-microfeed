<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatsong Microfeed</title>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    /* Form Card */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #09090b;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    /* Track Card */
    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .artist-name {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .track-title {
      font-size: 14px;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-badge {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    /* Embed Player Container */
    .player-container {
      margin: 14px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .player-container iframe {
      display: block;
      width: 100%;
    }

    .external-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #27272a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      color: var(--text-main);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover { background: #3f3f46; }
    .action-btn.wa:hover { background: #059669; }
    .action-btn.x:hover { background: #000; }

    /* Comments Section */
    .comments-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    .comments-heading {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0 0 10px 0;
    }

    .comment-item {
      background: #0f0f12;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent);
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .comment-author {
      font-weight: 700;
      color: var(--accent-light);
    }

    .comment-date {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .comment-text {
      color: #e4e4e7;
      margin: 0 0 8px 0;
      word-break: break-word;
      line-height: 1.4;
    }

    .comment-votes {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vote-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      width: 26px;
      height: 24px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      transition: all 0.15s;
    }

    .vote-btn:hover {
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .vote-btn.up.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--success);
      color: var(--success);
    }

    .vote-btn.down.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }

    .vote-score {
      font-weight: 700;
      font-size: 13px;
      min-width: 18px;
      text-align: center;
      color: var(--text-main);
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .comment-input-name {
      width: 30%;
    }

    .comment-input-text {
      width: 55%;
    }

    .btn-comment-submit {
      width: 15%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-comment-submit:hover {
      background: var(--accent-hover);
    }

    /* Toast Notification */
    .share-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #f4f4f5;
      color: #09090b;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10000;
    }

    .share-toast.visible {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Share Form -->
    <div class="form-card">
      <h2 style="margin-top:0">Share a track as fan</h2>
      <form id="trackForm">
        <div class="form-group">
          <label>Artist</label>
          <input type="text" id="artist" class="form-control" required placeholder="e.g. ChatsongMusic">
        </div>
        <div class="form-group">
          <label>Track title</label>
          <input type="text" id="title" class="form-control" required placeholder="e.g. Hope & Desire">
        </div>
        <div class="form-group">
          <label>Music link (Spotify, SoundCloud, YouTube, Apple Music)</label>
          <input type="url" id="url" class="form-control" required placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Genre / Tag</label>
          <select id="tag" class="form-control">
            <option value="Electronic">Electronic</option>
            <option value="Pop">Pop</option>
            <option value="Hip-Hop">Hip-Hop</option>
            <option value="Rock">Rock</option>
            <option value="Indie">Indie</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Share track</button>
      </form>
    </div>

    <!-- Feed Container -->
    <div id="feed">
      <p style="text-align:center; color: var(--text-muted);">Loading tracks...</p>
    </div>
  </div>

  <script>
    // YOUR GOOGLE APPS SCRIPT WEB APP URL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeFEwlFQ45w4N_NUZum10koCN5PvaxY3xVMYdfnPX2NRuAlzhFX-vRbFP-eO_c-vWhCg/exec';

    // MODERATOR PASSWORD FOR DELETING TRACKS (Change this to whatever you want!)
    const MODERATOR_PIN = '1234';

    // 1. UNIVERSAL EMBED PLAYER
    function getUniversalEmbedUrl(rawUrl) {
      if (!rawUrl) return null;
      const url = rawUrl.trim().split('?')[0];

      if (url.includes('spotify.com')) {
        return url.replace('open.spotify.com/', 'open.spotify.com/embed/');
      }

      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let videoId = '';
        if (url.includes('youtu.be/')) {
          videoId = url.split('youtu.be/')[1];
        } else if (url.includes('v=')) {
          videoId = url.split('v=').slice(1).join('v=').split('&')[0];
        }
        return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
      }

      if (url.includes('music.apple.com')) {
        return url.replace('music.apple.com', 'embed.music.apple.com');
      }

      if (url.includes('soundcloud.com')) {
        return `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
      }

      return null;
    }

    function renderPlayer(url) {
      const embedUrl = getUniversalEmbedUrl(url);

      if (embedUrl) {
        let height = '152';
        if (embedUrl.includes('youtube.com')) height = '315';
        if (embedUrl.includes('soundcloud.com')) height = '166';

        return `
          <div class="player-container">
            <iframe src="${embedUrl}" width="100%" height="${height}" frameborder="0" allowtransparency="true" allow="encrypted-media; clipboard-write"></iframe>
          </div>
        `;
      }

      return `
        <div class="player-container">
          <a href="${url}" target="_blank" rel="noopener noreferrer" class="external-btn">
            ▶ Play on platform
          </a>
        </div>
      `;
    }

    // 2. SHARING FUNCTIONS
    async function shareTrack(artist, title, url) {
      const shareData = {
        title: `${artist} - ${title}`,
        text: `Listen to "${title}" by ${artist} on Chatsong!`,
        url: url
      };

      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      }

      try {
        await navigator.clipboard.writeText(url);
        showToast('Link copied to clipboard!');
      } catch (err) {
        prompt('Copy link:', url);
      }
    }

    function shareToPlatform(platform, artist, title, url) {
      const text = encodeURIComponent(`Listen to "${title}" by ${artist} on Chatsong!`);
      const link = encodeURIComponent(url);

      if (platform === 'native') {
        shareTrack(artist, title, url);
      } else if (platform === 'whatsapp') {
        window.open(`https://api.whatsapp.com/send?text=${text}%20${link}`, '_blank');
      } else if (platform === 'twitter') {
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${link}`, '_blank');
      }
    }

    function showToast(message) {
      let toast = document.getElementById('share-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'share-toast';
        toast.className = 'share-toast';
        document.body.appendChild(toast);
      }
      toast.innerText = message;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2500);
    }

    // 3. LOAD FEED & TRACKS
    async function loadFeed() {
      const feedContainer = document.getElementById('feed');
      try {
        const res = await fetch(`${GAS_URL}?action=posts`);
        const data = await res.json();

        if (!data.success || !data.posts) {
          feedContainer.innerHTML = `<p style="color:red">Error loading feed: ${data.error || 'Unknown error'}</p>`;
          return;
        }

        if (data.posts.length === 0) {
          feedContainer.innerHTML = '<p style="text-align:center">No tracks shared yet.</p>';
          return;
        }

        feedContainer.innerHTML = data.posts.map(post => `
          <div class="track-card" id="track-${post.id}">
            <div class="track-header">
              <div>
                <h3 class="artist-name">${escapeHtml(post.artist)}</h3>
                <p class="track-title">${escapeHtml(post.title)}</p>
              </div>
              <div class="header-actions">
                ${post.tag ? `<span class="tag-badge">${escapeHtml(post.tag)}</span>` : ''}
                <button class="btn-delete" title="Moderator Delete" onclick="deleteTrack('${post.id}')">🗑️ Delete</button>
              </div>
            </div>

            ${renderPlayer(post.url)}

            <div class="action-bar">
              <button class="action-btn" onclick="shareToPlatform('native', '${escapeJs(post.artist)}', '${escapeJs(post.title)}', '${escapeJs(post.url)}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                Share
              </button>
              <button class="action-btn wa" onclick="shareToPlatform('whatsapp', '${escapeJs(post.artist)}', '${escapeJs(post.title)}', '${escapeJs(post.url)}')">
                WhatsApp
              </button>
              <button class="action-btn x" onclick="shareToPlatform('twitter', '${escapeJs(post.artist)}', '${escapeJs(post.title)}', '${escapeJs(post.url)}')">
                X
              </button>
            </div>

            <!-- Comments Section -->
            <div class="comments-section">
              <p class="comments-heading">Comments</p>
              <div id="comments-list-${post.id}">
                <p style="font-size:12px; color:var(--text-muted)">Loading comments...</p>
              </div>
              <form class="comment-form" onsubmit="submitComment(event, '${post.id}')">
                <input type="text" class="form-control comment-input-name" placeholder="Name" required>
                <input type="text" class="form-control comment-input-text" placeholder="Write a comment..." required>
                <button type="submit" class="btn-comment-submit">Post</button>
              </form>
            </div>
          </div>
        `).join('');

        // Load comments for each track
        data.posts.forEach(post => loadComments(post.id));

      } catch (err) {
        feedContainer.innerHTML = `<p style="color:red">Could not connect to backend.</p>`;
      }
    }

    // 4. COMMENTS LOGIC
    function getVoteState(commentId) {
      try {
        const votes = JSON.parse(localStorage.getItem('chatsong_comment_votes') || '{}');
        return votes[commentId] || null; // 'up', 'down', or null
      } catch (err) {
        return null;
      }
    }

    function setVoteState(commentId, direction) {
      try {
        const votes = JSON.parse(localStorage.getItem('chatsong_comment_votes') || '{}');
        if (direction === null) {
          delete votes[commentId];
        } else {
          votes[commentId] = direction;
        }
        localStorage.setItem('chatsong_comment_votes', JSON.stringify(votes));
      } catch (err) {
        // localStorage unavailable - voting will still work, it just won't be remembered
      }
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    }

    async function loadComments(trackId) {
      const container = document.getElementById(`comments-list-${trackId}`);
      try {
        const res = await fetch(`${GAS_URL}?action=comments&trackId=${trackId}`);
        const data = await res.json();

        if (data.success && data.comments) {
          if (data.comments.length === 0) {
            container.innerHTML = '<p style="font-size:12px; color:var(--text-muted); margin:4px 0;">No comments yet.</p>';
            return;
          }

          container.innerHTML = data.comments.map(c => {
            const voteState = getVoteState(c.id);
            return `
            <div class="comment-item" id="comment-${c.id}">
              <div class="comment-header">
                <span class="comment-author">${escapeHtml(c.name)}</span>
                <span class="comment-date">${formatDate(c.createdAt)}</span>
              </div>
              <p class="comment-text">${escapeHtml(c.comment)}</p>
              <div class="comment-votes">
                <button class="vote-btn up ${voteState === 'up' ? 'active' : ''}" onclick="voteComment('${c.id}', '${trackId}', 'up')" title="Upvote">▲</button>
                <span class="vote-score" id="score-${c.id}">${c.votes || 0}</span>
                <button class="vote-btn down ${voteState === 'down' ? 'active' : ''}" onclick="voteComment('${c.id}', '${trackId}', 'down')" title="Downvote">▼</button>
              </div>
            </div>
          `;
          }).join('');
        }
      } catch (err) {
        container.innerHTML = '';
      }
    }

    async function voteComment(commentId, trackId, direction) {
      const currentState = getVoteState(commentId);

      // Clicking the same direction again removes the vote instead of doubling it
      let effectiveDirection = direction;
      if (currentState === direction) {
        effectiveDirection = direction === 'up' ? 'down' : 'up'; // cancel out the previous vote
        setVoteState(commentId, null);
      } else if (currentState && currentState !== direction) {
        // Switching from up to down (or vice versa) counts as two steps
        setVoteState(commentId, direction);
      } else {
        setVoteState(commentId, direction);
      }

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'voteComment', commentId: commentId, direction: effectiveDirection })
        });
        const data = await res.json();

        if (data.success) {
          const scoreEl = document.getElementById(`score-${commentId}`);
          if (scoreEl) scoreEl.textContent = data.votes;

          const item = document.getElementById(`comment-${commentId}`);
          if (item) {
            const upBtn = item.querySelector('.vote-btn.up');
            const downBtn = item.querySelector('.vote-btn.down');
            const newState = getVoteState(commentId);
            upBtn.classList.toggle('active', newState === 'up');
            downBtn.classList.toggle('active', newState === 'down');
          }
        }
      } catch (err) {
        // Silently ignore - the button just won't visually update
      }
    }

    async function submitComment(event, trackId) {
      event.preventDefault();
      const form = event.target;
      const nameInput = form.querySelector('.comment-input-name');
      const textInput = form.querySelector('.comment-input-text');
      const submitBtn = form.querySelector('button');

      submitBtn.disabled = true;

      const payload = {
        action: 'createComment',
        trackId: trackId,
        name: nameInput.value,
        comment: textInput.value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          textInput.value = '';
          loadComments(trackId);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Could not post comment.');
      } finally {
        submitBtn.disabled = false;
      }
    }

    // 5. MODERATOR DELETE LOGIC
    async function deleteTrack(trackId) {
      const pin = prompt('Enter Moderator PIN to delete this track:');
      if (pin !== MODERATOR_PIN) {
        if (pin !== null) alert('Incorrect PIN.');
        return;
      }

      if (!confirm('Are you sure you want to delete this track?')) return;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deletePost', id: trackId })
        });
        const data = await res.json();

        if (data.success) {
          showToast('Track deleted!');
          loadFeed();
        } else {
          alert('Error deleting: ' + data.error);
        }
      } catch (err) {
        alert('Could not delete track.');
      }
    }

    // 6. SUBMIT NEW TRACK
    document.getElementById('trackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sharing...';

      const payload = {
        action: 'createPost',
        artist: document.getElementById('artist').value,
        title: document.getElementById('title').value,
        url: document.getElementById('url').value,
        tag: document.getElementById('tag').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          e.target.reset();
          loadFeed();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('An error occurred while saving.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Share track';
      }
    });

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return String(str || '').replace(/'/g, "\\'");
    }

    // Initialize feed
    loadFeed();
  </script>
</body>
</html>
