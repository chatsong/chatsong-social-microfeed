<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatsong Microfeed</title>
  <style>
    :root {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --border-color: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    /* Formulier */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #09090b;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    /* Track Kaarten */
    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .artist-name {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .track-title {
      font-size: 14px;
      color: var(--text-muted);
      margin: 2px 0 0 0;
    }

    .tag-badge {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Embed Player Container */
    .player-container {
      margin: 14px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .player-container iframe {
      display: block;
      width: 100%;
    }

    .external-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #27272a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Deelknoppen */
    .action-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      color: var(--text-main);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: #3f3f46;
    }

    .action-btn.wa:hover { background: #059669; }
    .action-btn.x:hover { background: #000; }

    /* Toast melding op desktop */
    .share-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #f4f4f5;
      color: #09090b;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10000;
    }

    .share-toast.visible {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Post Formulier -->
    <div class="form-card">
      <h2 style="margin-top:0">Share a Track</h2>
      <form id="trackForm">
        <div class="form-group">
          <label>Artiest</label>
          <input type="text" id="artist" class="form-control" required placeholder="bijv. ChatsongMusic">
        </div>
        <div class="form-group">
          <label>Titel</label>
          <input type="text" id="title" class="form-control" required placeholder="bijv. Hope & Desire">
        </div>
        <div class="form-group">
          <label>Muziek URL (Spotify, SoundCloud, YouTube, Apple Music)</label>
          <input type="url" id="url" class="form-control" required placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Genre / Tag</label>
          <select id="tag" class="form-control">
            <option value="Electronic">Electronic</option>
            <option value="Pop">Pop</option>
            <option value="Hip-Hop">Hip-Hop</option>
            <option value="Rock">Rock</option>
            <option value="Indie">Indie</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Deel Track</button>
      </form>
    </div>

    <!-- Feed met Tracks -->
    <div id="feed">
      <p style="text-align:center; color: var(--text-muted);">Tracks laden...</p>
    </div>
  </div>

  <script>
    // VOER HIER JOUW APPS SCRIPT WEB APP URL IN:
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwyxMy9cemujAQh0KwExY4RRSoprYFvsn0xpbxLS7SieqjKWZBoagahJtFPLn3nFXPnhw/exec';

    // 1. UNIVERSELE AUDIO PLAYER (Spotify, SoundCloud, YouTube, Apple Music)
    function getUniversalEmbedUrl(rawUrl) {
      if (!rawUrl) return null;
      const url = rawUrl.trim().split('?')[0]; // Strip tracking parameters

      // Spotify
      if (url.includes('spotify.com')) {
        return url.replace('open.spotify.com/', 'open.spotify.com/embed/');
      }

      // YouTube & YouTube Music
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let videoId = '';
        if (url.includes('youtu.be/')) {
          videoId = url.split('youtu.be/')[1];
        } else if (url.includes('v=')) {
          videoId = url.split('v=').slice(1).join('v=').split('&')[0];
        }
        return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
      }

      // Apple Music
      if (url.includes('music.apple.com')) {
        return url.replace('music.apple.com', 'embed.music.apple.com');
      }

      // SoundCloud
      if (url.includes('soundcloud.com')) {
        return `https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
      }

      return null;
    }

    function renderPlayer(url) {
      const embedUrl = getUniversalEmbedUrl(url);

      if (embedUrl) {
        let height = '152';
        if (embedUrl.includes('youtube.com')) height = '315';
        if (embedUrl.includes('spotify.com')) height = '152';
        if (embedUrl.includes('soundcloud.com')) height = '166';

        return `
          <div class="player-container">
            <iframe src="${embedUrl}" width="100%" height="${height}" frameborder="0" allowtransparency="true" allow="encrypted-media; clipboard-write"></iframe>
          </div>
        `;
      }

      return `
        <div class="player-container">
          <a href="${url}" target="_blank" rel="noopener noreferrer" class="external-btn">
            ▶ listen on platform
          </a>
        </div>
      `;
    }

    // 2. MODERNE DEELFUNCTIES (Mobiel + Desktop)
    async function shareTrack(artist, title, url) {
      const shareData = {
        title: `${artist} - ${title}`,
        text: `Luister naar "${title}" van ${artist} op Chatsong!`,
        url: url
      };

      // Native Mobiel & Mac/Edge Share
      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      }

      // Desktop Fallback -> Klembord
      try {
        await navigator.clipboard.writeText(url);
        showToast('Link gekopieerd naar klembord!');
      } catch (err) {
        prompt('Kopieer de link:', url);
      }
    }

    function shareToPlatform(platform, artist, title, url) {
      const text = encodeURIComponent(`Luister naar "${title}" van ${artist} op Chatsong!`);
      const link = encodeURIComponent(url);

      if (platform === 'native') {
        shareTrack(artist, title, url);
      } else if (platform === 'whatsapp') {
        window.open(`https://api.whatsapp.com/send?text=${text}%20${link}`, '_blank');
      } else if (platform === 'twitter') {
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${link}`, '_blank');
      }
    }

    function showToast(message) {
      let toast = document.getElementById('share-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'share-toast';
        toast.className = 'share-toast';
        document.body.appendChild(toast);
      }
      toast.innerText = message;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2500);
    }

    // 3. FEED LADEN EN INVOEREN
    async function loadFeed() {
      const feedContainer = document.getElementById('feed');
      try {
        const res = await fetch(`${GAS_URL}?action=posts`);
        const data = await res.json();

        if (!data.success || !data.posts) {
          feedContainer.innerHTML = `<p style="color:red">Fout bij laden: ${data.error || 'Onbekende fout'}</p>`;
          return;
        }

        if (data.posts.length === 0) {
          feedContainer.innerHTML = '<p style="text-align:center">Nog geen tracks gedeeld.</p>';
          return;
        }

        feedContainer.innerHTML = data.posts.map(post => `
          <div class="track-card">
            <div class="track-header">
              <div>
                <h3 class="artist-name">${escapeHtml(post.artist)}</h3>
                <p class="track-title">${escapeHtml(post.title)}</p>
              </div>
              ${post.tag ? `<span class="tag-badge">${escapeHtml(post.tag)}</span>` : ''}
            </div>
            
            ${renderPlayer(post.url)}

            <div class="action-bar">
              <button class="action-btn" onclick="shareToPlatform('native', '${escapeJs(post.artist)}', '${escapeJs(post.title)}', '${escapeJs(post.url)}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                Delen
              </button>
              <button class="action-btn wa" onclick="shareToPlatform('whatsapp', '${escapeJs(post.artist)}', '${escapeJs(post.title)}', '${escapeJs(post.url)}')">
                WhatsApp
              </button>
              <button class="action-btn x" onclick="shareToPlatform('twitter', '${escapeJs(post.artist)}', '${escapeJs(post.title)}', '${escapeJs(post.url)}')">
                X
              </button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        feedContainer.innerHTML = `<p style="color:red">Kan geen verbinding maken met de backend.</p>`;
      }
    }

    // Formulieren verzenden naar Google Sheet
    document.getElementById('trackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Versturen...';

      const payload = {
        action: 'createPost',
        artist: document.getElementById('artist').value,
        title: document.getElementById('title').value,
        url: document.getElementById('url').value,
        tag: document.getElementById('tag').value
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          e.target.reset();
          loadFeed();
        } else {
          alert('Fout: ' + data.error);
        }
      } catch (err) {
        alert('Er is een fout opgetreden bij het opslaan.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Deel Track';
      }
    });

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJs(str) {
      return String(str || '').replace(/'/g, "\\'");
    }

    // Start direct bij het laden van de pagina
    loadFeed();
  </script>
</body>
</html>
